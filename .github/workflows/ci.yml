name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel a running CI job when a newer commit lands on the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: tests + types
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run tests
        run: bun test test/

      - name: Type check
        run: npm run typecheck

      - name: Audit runtime dependencies
        run: |
          for attempt in 1 2 3; do
            if npm audit --omit=dev --audit-level=high --fetch-retries=0 --fetch-timeout=60000; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::npm audit failed after 3 attempts"
              exit 1
            fi
            echo "::warning::npm audit attempt $attempt failed; retrying after $((attempt * 30)) seconds"
            sleep $((attempt * 30))
          done
