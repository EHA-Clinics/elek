name: elek

on:
  issue_comment:
    types: [created]

# When the same branch gets multiple pushes in quick succession, cancel
# the in-flight review and only run on the latest commit. Saves API spend.
concurrency:
  group: elek-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.issue.number || github.ref }}
  cancel-in-progress: true

# Self-review is advisory because provider quota and transient model failures
# should not block test-verified code. The action itself still posts a visible
# tracking comment when a provider fails.
permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  # Both lanes run on OpenRouter models the account guardrail allows, with the org
  # OPENROUTER_API_KEY (owner ruling 8, EHAC-2844). The former direct-DeepSeek lane had
  # no key in this repo ("No API key found for deepseek"), and kimi-k2.7-code is blocked
  # by the guardrail (404 "0 endpoints"). Model ids keep the `openrouter/` prefix:
  # without it pi resolves the native provider and fails with "No API key".

  # ── OpenRouter DeepSeek v4.1 Flash ───────────────────────────────────
  deepseek-flash:
    name: "openrouter-deepseek-v4.1-flash"
    if: ${{ github.event.issue.pull_request && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) && !endsWith(github.actor, '[bot]') }}
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          fetch-depth: 0

      - name: Advisory elek review
        id: review
        uses: ./
        continue-on-error: true
        timeout-minutes: 12
        with:
          openrouter_api_key: ${{ secrets.OPENROUTER_API_KEY }}
          provider: openrouter
          model: openrouter/deepseek/deepseek-v4.1-flash
          thinking: high
          max_turns: 6
          branch_prefix: elek/deepseek-flash/
          prompt: |
            Review this PR for correctness, security, performance, and style.
            Be specific — reference files and line numbers. Think step by step.
            Do not claim external GitHub Action versions are unpublished unless
            this run failed while resolving them; by the time this prompt runs,
            checkout and this composite action have already resolved.

      - name: Report advisory review failure
        if: steps.review.outcome == 'failure'
        run: echo "::warning::Advisory OpenRouter DeepSeek v4.1 Flash review failed; inspect the tracking comment and run logs."

  # ── OpenRouter Xiaomi MiMo v2.6 Pro ──────────────────────────────────
  mimo:
    name: "openrouter-mimo-v2.6-pro"
    if: ${{ github.event.issue.pull_request && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) && !endsWith(github.actor, '[bot]') }}
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          fetch-depth: 0

      - name: Advisory elek review
        id: review
        uses: ./
        continue-on-error: true
        timeout-minutes: 12
        with:
          openrouter_api_key: ${{ secrets.OPENROUTER_API_KEY }}
          provider: openrouter
          model: openrouter/xiaomi/mimo-v2.6-pro
          thinking: high
          # mimo-v2.6-pro endpoints accept `reasoning` but not a named effort, so its
          # reasoning is enabled with a token cap, as the council runs it.
          openrouter_model_reasoning_modes: '{"xiaomi/mimo-v2.6-pro":{"mode":"enabled","max_tokens":12000}}'
          max_turns: 6
          branch_prefix: elek/mimo/
          prompt: |
            Review this PR for correctness, security, performance, and style.
            Be specific — reference files and line numbers. Think step by step.
            Do not claim external GitHub Action versions are unpublished unless
            this run failed while resolving them; by the time this prompt runs,
            checkout and this composite action have already resolved.

      - name: Report advisory review failure
        if: steps.review.outcome == 'failure'
        run: echo "::warning::Advisory OpenRouter MiMo v2.6 Pro review failed; inspect the tracking comment and run logs."
